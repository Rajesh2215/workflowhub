apiVersion: apps/v1

kind: Deployment

metadata:
  name: auth-service

spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: auth-service
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          readinessProbe:
            exec:
              command:
                - node
                - /app/scripts/check-rabbitmq.js
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - readlink /proc/1/exe | grep -q node
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - node
                - /app/scripts/check-rabbitmq.js
            periodSeconds: 5
            failureThreshold: 12
