apiVersion: v1

kind: ConfigMap

metadata:
  name: api-gateway-config

data:
  PORT: "3000"
  NODE_ENV: "production"
  CORS_ORIGIN: "*"
  FRONTEND_URL: "http://localhost:3000"
  API_GATEWAY_THROTTLE_LIMIT: "60"
  API_GATEWAY_THROTTLE_TTL: "60"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  AUTH_SERVICE_GRPC_URL: "auth-service:50051"
  TASK_SERVICE_GRPC_URL: "task-service:50052"
  ANALYTICS_SERVICE_GRPC_URL: "analytics-service:50053"
