name: Build and Push Images

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - task-service
          - notification-service
          - analytics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: |
          echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev

    steps:
      - name: Deploy to EC2 using Helm
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/Workflowhub

            helm upgrade --install workflowhub ./helm/workflowhub \
              -n workflowhub \
              --set apiGateway.image.tag=${{ github.sha }} \
              --set authService.image.tag=${{ github.sha }} \
              --set taskService.image.tag=${{ github.sha }} \
              --set notificationService.image.tag=${{ github.sha }} \
              --set analyticsService.image.tag=${{ github.sha }} \
              --set-string apiGateway.secret.RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              --set-string apiGateway.secret.JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              --set-string authService.secret.RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              --set-string authService.secret.MONGO_URI='${{ secrets.AUTH_MONGO_URI }}' \
              --set-string authService.secret.JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              --set-string taskService.secret.RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              --set-string taskService.secret.MONGO_URI='${{ secrets.TASK_MONGO_URI }}' \
              --set-string notificationService.secret.RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              --set-string notificationService.secret.MONGO_URI='${{ secrets.NOTIFICATION_MONGO_URI }}' \
              --set-string analyticsService.secret.RABBITMQ_URL='${{ secrets.RABBITMQ_URL }}' \
              --set-string analyticsService.secret.MONGO_URI='${{ secrets.ANALYTICS_MONGO_URI }}'