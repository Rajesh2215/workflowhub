name: Build and Push Images

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - task-service
          - notification-service
          - analytics-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image prefix
        run: |
          echo "IMAGE_PREFIX=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest


  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev

    steps:
      - name: Deploy to EC2 using Helm
        uses: appleboy/ssh-action@v1.2.2
        env:
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGO_URI_AUTH: ${{ secrets.MONGO_URI_AUTH }}
          MONGO_URI_TASK: ${{ secrets.MONGO_URI_TASK }}
          MONGO_URI_NOTIFICATION: ${{ secrets.MONGO_URI_NOTIFICATION }}
          MONGO_URI_ANALYTICS: ${{ secrets.MONGO_URI_ANALYTICS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: RABBITMQ_URL,JWT_SECRET,MONGO_URI_AUTH,MONGO_URI_TASK,MONGO_URI_NOTIFICATION,MONGO_URI_ANALYTICS

          script: |
            set -e

            cd ~/Workflowhub

            echo "Current directory:"
            pwd

            echo "Checking Helm chart..."
            ls -la ./helm/workflowhub

            echo "Deploying SHA: ${{ github.sha }}"

            helm upgrade --install workflowhub ./helm/workflowhub \
              -n workflowhub \
              --set apiGateway.image.tag=${{ github.sha }} \
              --set authService.image.tag=${{ github.sha }} \
              --set taskService.image.tag=${{ github.sha }} \
              --set notificationService.image.tag=${{ github.sha }} \
              --set analyticsService.image.tag=${{ github.sha }} \
              --set-string apiGateway.secret.RABBITMQ_URL="$RABBITMQ_URL" \
              --set-string apiGateway.secret.JWT_SECRET="$JWT_SECRET" \
              --set-string authService.secret.RABBITMQ_URL="$RABBITMQ_URL" \
              --set-string authService.secret.MONGO_URI="$MONGO_URI_AUTH" \
              --set-string authService.secret.JWT_SECRET="$JWT_SECRET" \
              --set-string taskService.secret.RABBITMQ_URL="$RABBITMQ_URL" \
              --set-string taskService.secret.MONGO_URI="$MONGO_URI_TASK" \
              --set-string notificationService.secret.RABBITMQ_URL="$RABBITMQ_URL" \
              --set-string notificationService.secret.MONGO_URI="$MONGO_URI_NOTIFICATION" \
              --set-string analyticsService.secret.RABBITMQ_URL="$RABBITMQ_URL" \
              --set-string analyticsService.secret.MONGO_URI="$MONGO_URI_ANALYTICS"

            echo "Deployment completed successfully."