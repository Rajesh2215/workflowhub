replicaCount: 1

image:
  repository: apache/kafka
  tag: "3.7.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9093

probes:
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    periodSeconds: 5
    failureThreshold: 24
