replicaCount: 1

image:
  repository: ghcr.io/your-org/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  host: ""
  path: /
  pathType: Prefix
  tls: []

config:
  PORT: "3000"
  NODE_ENV: production
  CORS_ORIGIN: "*"
  FRONTEND_URL: "http://localhost:3000"
  API_GATEWAY_THROTTLE_LIMIT: "60"
  API_GATEWAY_THROTTLE_TTL: "60"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
  AUTH_SERVICE_GRPC_URL: "auth-service:50051"
  TASK_SERVICE_GRPC_URL: "task-service:50052"
  ANALYTICS_SERVICE_GRPC_URL: "analytics-service:50053"

secret:
  RABBITMQ_URL: ""
  JWT_SECRET: ""

resources:
  requests:
    cpu: 100m
  limits:
    cpu: 500m

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
  startup:
    periodSeconds: 5
    failureThreshold: 12

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  averageUtilization: 60

metrics:
  enabled: true
  path: /api/metrics
  interval: 15s