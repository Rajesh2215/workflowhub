apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
data:
  PORT: {{ .Values.config.PORT | quote }}
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  CORS_ORIGIN: {{ .Values.config.CORS_ORIGIN | quote }}
  FRONTEND_URL: {{ .Values.config.FRONTEND_URL | quote }}
  API_GATEWAY_THROTTLE_LIMIT: {{ .Values.config.API_GATEWAY_THROTTLE_LIMIT | quote }}
  API_GATEWAY_THROTTLE_TTL: {{ .Values.config.API_GATEWAY_THROTTLE_TTL | quote }}
  REDIS_HOST: {{ .Values.config.REDIS_HOST | quote }}
  REDIS_PORT: {{ .Values.config.REDIS_PORT | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
  AUTH_SERVICE_GRPC_URL: {{ .Values.config.AUTH_SERVICE_GRPC_URL | quote }}
  TASK_SERVICE_GRPC_URL: {{ .Values.config.TASK_SERVICE_GRPC_URL | quote }}
  ANALYTICS_SERVICE_GRPC_URL: {{ .Values.config.ANALYTICS_SERVICE_GRPC_URL | quote }}
