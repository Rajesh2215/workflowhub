# Headless service — clusterIP: None
#
# Required by the StatefulSet so Kubernetes creates stable DNS A-records
# for each pod, enabling the MongoDB replica set members to address each other:
#
#   mongo-task-0.mongo-task.<namespace>.svc.cluster.local:27017  (PRIMARY)
#   mongo-task-1.mongo-task.<namespace>.svc.cluster.local:27017  (SECONDARY)
#   mongo-task-2.mongo-task.<namespace>.svc.cluster.local:27017  (SECONDARY)
#
# The application does NOT connect through this service directly; it uses
# the seed host list in MONGO_URI with ?replicaSet=rs0.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mongo-task.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "mongo-task.fullname" . }}
spec:
  clusterIP: None
  selector:
    app: {{ include "mongo-task.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: mongo
