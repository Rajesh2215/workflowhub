apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mongo-task.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  # serviceName must match the headless Service name so Kubernetes
  # generates stable per-pod DNS entries:
  #   mongo-task-0.mongo-task.<namespace>.svc.cluster.local
  #   mongo-task-1.mongo-task.<namespace>.svc.cluster.local
  #   mongo-task-2.mongo-task.<namespace>.svc.cluster.local
  serviceName: {{ include "mongo-task.fullname" . }}
  replicas: 3
  selector:
    matchLabels:
      app: {{ include "mongo-task.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "mongo-task.fullname" . }}
    spec:
      # Allow graceful termination so in-flight writes complete before
      # the pod is killed. MongoDB flushes and steps down within this window.
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Start mongod in replica set mode.
          # --bind_ip_all is required so the pod accepts connections from
          # other pods and from the init job.
          args:
            - "--replSet"
            - {{ .Values.replicaSetName | quote }}
            - "--bind_ip_all"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: mongo
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - db.adminCommand('ping').ok
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  # volumeClaimTemplates provisions one dedicated PVC per pod:
  #   mongo-data-mongo-task-0
  #   mongo-data-mongo-task-1
  #   mongo-data-mongo-task-2
  # Each replica stores its own data independently, as required by MongoDB.
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
