image:
  repository: mongo
  tag: "7"
  pullPolicy: IfNotPresent

# Name of the MongoDB replica set.
# Must match the --replSet arg and the replicaSet= URI parameter used
# in every service that connects to this MongoDB instance.
replicaSetName: rs0

service:
  type: ClusterIP
  port: 27017

storage:
  # 10Gi per replica (3 nodes = 30Gi total).
  # Each node gets its own PVC via volumeClaimTemplates.
  size: 10Gi
  className: ""

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 12
